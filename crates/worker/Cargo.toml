[package]
name = "notespace-worker"
description = "Cloudflare Workers entrypoint. Wires the web layer to a D1-backed Store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
notespace-core = { workspace = true }
notespace-render = { workspace = true }
worker = { version = "0.8", features = ["d1", "http", "axum"] }
worker-macros = { version = "0.8", features = ["http"] }
axum = { version = "0.8", default-features = false, features = ["query"] }
tower-service = "0.3"
console_error_panic_hook = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
