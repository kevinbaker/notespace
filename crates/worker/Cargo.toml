[package]
name = "notespace-worker"
description = "Cloudflare Workers entrypoint. Wires the web layer to a D1-backed Store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
notespace-core = { workspace = true, default-features = false }
notespace-render = { workspace = true }
worker = { version = "0.8", features = ["d1", "http", "axum"] }
worker-macros = { version = "0.8", features = ["http"] }
axum = { version = "0.8", default-features = false, features = ["query"] }
tower-service = "0.3"
console_error_panic_hook = "0.1"
# `js` routes getrandom at crypto.getRandomValues, which is what makes DESIGN.md §9's
# "no system RNG on wasm" constraint tractable. v0.2's feature works without RUSTFLAGS,
# unlike v0.3's backend cfg.
getrandom = { version = "0.2", features = ["js"] }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Local password login on the Worker. Off by default: it does not fit the free plan's 10 ms CPU
# budget at OWASP strength (DESIGN.md §4.10), and OIDC is the intended path. Costs ~10.6 KB
# gzipped when enabled.
password = ["notespace-core/password"]
# PBKDF2 through the runtime's crypto.subtle. ~2.0 KB gzipped, because the cryptography lives in
# the runtime and only the binding glue is compiled in. Still over budget on the free plan.
kdf-subtle = []
