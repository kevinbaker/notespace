[package]
name = "notespace-store-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notespace-core = { path = "../core", features = ["password"] }
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
notespace-render = { path = "../render" }
tokio = { version = "1", features = ["macros", "rt"] }
# `trace` lets the suite count statements, which is how the read path's query budget is checked.
rusqlite = { version = "0.37", features = ["bundled", "trace"] }
