[package]
name = "notespace-bench"
description = "Exposes the render paths to a Node harness so CPU can be measured in real wasm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Password-hashing candidates, measured against the 10 ms Worker CPU budget.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
notespace-core = { workspace = true, features = ["password"] }
notespace-render = { workspace = true }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
