[package]
name = "notespace-app"
description = "The web layer: routes, handlers and the Platform seam both targets implement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
notespace-core = { workspace = true, default-features = false }
notespace-render = { workspace = true }
notespace-app-macros = { path = "../app-macros" }
axum = { version = "0.8", default-features = false, features = ["query"] }
send_wrapper = { version = "0.6", features = ["futures"] }
# `js` routes getrandom at crypto.getRandomValues on wasm; on native it is the system RNG.
getrandom = { version = "0.2", features = ["js"] }
form_urlencoded = "1"
async-trait = "0.1"
maud = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
password = ["notespace-core/password"]
