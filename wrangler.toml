# Matches the Worker already created in the dashboard and wired to dev.notespace.org.
# `wrangler deploy` targets the Worker with THIS name -- deploying under a different name
# creates a second Worker and leaves the routed one serving its placeholder.
name = "notespace-dev"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2025-08-01"

# Off: dev.notespace.org is the only entry point. The Cache API is a no-op on *.workers.dev --
# it only caches for a zone you own -- so a workers.dev copy would measure a different system
# from the one being served.
#
# Must stay above the first [table] header: TOML assigns a bare key to whichever table precedes
# it, so this sitting below [[d1_databases]] made it a D1 field that wrangler silently dropped.
workers_dev = false

# dev.notespace.org is attached to this Worker via the dashboard, and is left that way
# deliberately: wrangler only manages routes it is told about, so an undeclared route survives a
# deploy untouched. To bring it under version control instead, uncomment below -- but only once a
# deploy has succeeded, since a custom_domain that already exists elsewhere makes the deploy fail
# rather than adopt it.
#
# routes = [
#   { pattern = "dev.notespace.org", custom_domain = true }
# ]

# Runs on `wrangler dev` and `wrangler deploy` from a machine that has Rust. It does NOT run in
# Cloudflare's own build environment (Workers Builds / the dashboard's Git integration), which
# ships Node but not rustup, cargo or worker-build.
[build]
# Wrangler runs this through /bin/sh, which does not source your shell profile, so ~/.cargo/bin
# is usually absent from PATH even when worker-build is installed. Prepending it here avoids
# "worker-build: not found" (exit 127).
#
# Cargo features come from NOTESPACE_FEATURES, since wrangler has no flag for them:
# `NOTESPACE_FEATURES=password wrangler deploy` builds local password login in. Empty is the
# default build. An empty --features list is accepted by cargo, so the variable can be unset.
command = 'PATH="$HOME/.cargo/bin:$PATH" worker-build --release -- --features "${NOTESPACE_FEATURES:-}"'
cwd = "crates/worker"

[[d1_databases]]
# `binding` must match DB_BINDING in crates/worker/src/lib.rs. A mismatch fails at runtime with
# "no D1 binding", not at build time.
#
# These bindings REPLACE whatever is configured in the dashboard when you `wrangler deploy`, so
# database_id must be the real notespace-dev id -- a stale one points the deployed Worker at the
# wrong database and every page 500s.
binding = "DATABASE"
database_name = "notespace-dev"
database_id = "b8eef966-34ce-43e3-abd2-739e56d622d5"
migrations_dir = "migrations"

# Workers AI, for the moderation classifier. `binding` must match AI_BINDING in
# crates/worker/src/moderation.rs. Absent, moderation falls back to holding posts for a human
# with no model in the loop. Under `wrangler dev` this binding always calls the real service and
# spends real neurons, local or not.
[ai]
binding = "AI"

# The moderation queue: the reply handler produces, this Worker consumes. `binding` must match
# QUEUE_BINDING in crates/worker/src/moderation.rs. Create it once with
# `wrangler queues create notespace-moderation`. On the free plan each message costs about three
# of the day's 10,000 operations (write, read, ack); the cron sweep below is what makes losing
# the queue harmless.
[[queues.producers]]
binding = "MODERATION"
queue = "notespace-moderation"

[[queues.consumers]]
queue = "notespace-moderation"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# Cloudflare Email Service, for verification and password-reset mail. `name` must match
# EMAIL_BINDING in crates/worker/src/mail.rs. No key: the binding carries the authority. The
# sending domain in EMAIL_FROM has to be onboarded once, `wrangler email sending enable <domain>`
# (or Compute & AI > Email Service in the dashboard), which adds its SPF and DKIM records. Until
# then every send is refused with E_SENDER_NOT_VERIFIED, logged, and the flow carries on.
# Under `wrangler dev` add `remote = true` here to send real mail; otherwise sends are no-ops.
[[send_email]]
name = "EMAIL"

# The sweep: classifies anything still pending that the queue did not deliver. Every five
# minutes, SWEEP_LIMIT posts per run. It only ever spends on posts the queue missed, so its
# cost is bounded by held-post volume, not by the cadence; the cadence bounds how long a held
# post can wait if the queue is dead.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# workers_ai (default when the AI binding exists) | llama_guard | anthropic | openrouter |
# openrouter_guard | off, or a safety model in front of an instruct model joined with `+`:
# "llama_guard+workers_ai", "openrouter_guard+openrouter". `anthropic` needs
# `wrangler secret put ANTHROPIC_API_KEY`; the openrouter ones need OPENROUTER_API_KEY.
# MOD_MODEL overrides the instruct model, MOD_GUARD_MODEL the guard. Measured on real Hacker
# News comments (DECISIONS.md), the 8B default over-flags; "openrouter_guard+openrouter" with
# MOD_MODEL = "openai/gpt-4o-mini" is the cheap stack that behaved.
MOD_PROVIDER = "workers_ai"
# Comma-separated usernames who may work /mod/queue in addition to anyone with the moderator
# role in the database. The bootstrap path for the first admin.
MODERATORS = "kbaker"

# Outbound mail: address verification, password reset, and the "your password changed" notice.
# MAIL_PROVIDER picks the transport; every one needs EMAIL_FROM on a domain that provider has
# verified. With anything missing, mail is off -- accounts still work, addresses stay
# unconfirmed, and /forgot accepts requests it cannot fulfil (logged).
#
#   cloudflare      the [[send_email]] binding above. No key. The default when the binding
#                   exists. Email Service is in open beta; check the account's quota with
#                   `wrangler email sending list`.
#   cloudflare_api  the same service over REST, for an account other than this Worker's:
#                   `wrangler secret put MAIL_API_KEY` (a token with Email Sending permission)
#                   and CF_ACCOUNT_ID below.
#   resend          https://resend.com -- free 100/day, 3,000/month. MAIL_API_KEY (or the older
#                   RESEND_API_KEY).
#   postmark        https://postmarkapp.com -- free 100/month. MAIL_API_KEY is the server token;
#                   POSTMARK_STREAM optionally names a stream.
#   sendgrid        https://sendgrid.com -- MAIL_API_KEY.
#   mailgun         https://mailgun.com -- MAIL_API_KEY; MAILGUN_DOMAIN defaults to EMAIL_FROM's
#                   domain; MAILGUN_REGION = "eu" for an EU account.
#   brevo           https://brevo.com -- free 300/day. MAIL_API_KEY.
#   off             nothing, whatever else is configured.
#
# Empty falls back to `cloudflare` when the binding exists, then `resend` when RESEND_API_KEY
# is set, then off. Provider-specific vars are only read by their provider.
MAIL_PROVIDER = ""
EMAIL_FROM = "notespace <no-reply@notespace.org>"
CF_ACCOUNT_ID = ""
MAILGUN_DOMAIN = ""
MAILGUN_REGION = ""
POSTMARK_STREAM = ""
# Names the site in mail subjects and bodies.
SITE_NAME = "notespace"
# "true" makes an address mandatory at signup. Only sensible once mail is configured.
REQUIRE_EMAIL = "false"
# Closed registration: `wrangler secret put SIGNUP_CODE` makes /register ask for the code (a
# secret, so it stays out of version control); unset or empty means anyone may register.
# Where links in mail point. Empty means the request's own host, which is right when there is
# one hostname; set it when the Worker is reached through several.
BASE_URL = ""

[observability]
enabled = true

[placement]
mode = "smart"
