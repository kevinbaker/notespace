# Matches the Worker already created in the dashboard and wired to dev.notespace.org.
# `wrangler deploy` targets the Worker with THIS name -- deploying under a different name
# creates a second Worker and leaves the routed one serving its placeholder.
name = "notespace-dev"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2025-08-01"

# Off: dev.notespace.org is the only entry point. The Cache API is a no-op on *.workers.dev --
# it only caches for a zone you own -- so a workers.dev copy would measure a different system
# from the one being served.
#
# Must stay above the first [table] header: TOML assigns a bare key to whichever table precedes
# it, so this sitting below [[d1_databases]] made it a D1 field that wrangler silently dropped.
workers_dev = false

# dev.notespace.org is attached to this Worker via the dashboard, and is left that way
# deliberately: wrangler only manages routes it is told about, so an undeclared route survives a
# deploy untouched. To bring it under version control instead, uncomment below -- but only once a
# deploy has succeeded, since a custom_domain that already exists elsewhere makes the deploy fail
# rather than adopt it.
#
# routes = [
#   { pattern = "dev.notespace.org", custom_domain = true }
# ]

# Runs on `wrangler dev` and `wrangler deploy` from a machine that has Rust. It does NOT run in
# Cloudflare's own build environment (Workers Builds / the dashboard's Git integration), which
# ships Node but not rustup, cargo or worker-build.
[build]
# Wrangler runs this through /bin/sh, which does not source your shell profile, so ~/.cargo/bin
# is usually absent from PATH even when worker-build is installed. Prepending it here avoids
# "worker-build: not found" (exit 127).
command = 'PATH="$HOME/.cargo/bin:$PATH" worker-build --release'
cwd = "crates/worker"

[[d1_databases]]
# `binding` must match DB_BINDING in crates/worker/src/lib.rs. A mismatch fails at runtime with
# "no D1 binding", not at build time.
#
# These bindings REPLACE whatever is configured in the dashboard when you `wrangler deploy`, so
# database_id must be the real notespace-dev id -- a stale one points the deployed Worker at the
# wrong database and every page 500s.
binding = "DATABASE"
database_name = "notespace-dev"
database_id = "b8eef966-34ce-43e3-abd2-739e56d622d5"
migrations_dir = "migrations"

[observability]
enabled = true

[placement]
mode = "smart"
